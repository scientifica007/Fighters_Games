name: Game checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check fighters.js
          node --check render.js
          node --check visuals/stages.js
          node --check visuals/characters.js
          node --check visuals/combat.js
          node --check game.js
      - name: Balance and roster unit tests
        run: node --test tests/*.test.mjs
